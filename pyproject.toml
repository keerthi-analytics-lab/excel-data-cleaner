[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-data-cleaner"
version = "1.0.0"
description = "Command-line tool that cleans messy CSV/Excel data and exports a formatted Excel workbook with a cleaning report."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Keerthi" }]
keywords = ["excel", "data-cleaning", "pandas", "openpyxl", "automation"]
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/keerthi-analytics-lab/excel-data-cleaner"

[project.scripts]
data-cleaner = "data_cleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
